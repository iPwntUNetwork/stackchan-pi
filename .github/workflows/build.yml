name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: ESP-IDF v5.5.4 · esp32s3
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # repo is mounted with a different uid than the container user; without
      # this, git describe (IDF version stamp) fails with "dubious ownership"
      - name: Git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # managed components come from the ESP component registry; the lock file
      # pins exact versions, so a hash-keyed cache is safe (misses re-fetch)
      - name: Cache managed components
        uses: actions/cache@v4
        with:
          path: managed_components
          key: idf-deps-${{ runner.os }}-${{ hashFiles('main/idf_component.yml', 'dependencies.lock') }}
          restore-keys: |
            idf-deps-${{ runner.os }}-

      - name: Configure and build
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build

      - name: Size report
        run: |
          . "$IDF_PATH/export.sh"
          idf.py size > size-report.txt
          {
            echo "### 📦 Firmware size — \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:7}\`)"
            echo '```'
            cat size-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage flashable bundle
        run: |
          mkdir -p dist
          cp build/stackchan.bin                       dist/
          cp build/bootloader/bootloader.bin           dist/
          cp build/partition_table/partition-table.bin dist/
          cp build/ota_data_initial.bin                dist/
          cp build/flash_args                          dist/
          cp sdkconfig                                 dist/sdkconfig.txt
          cp size-report.txt                           dist/
          {
            echo "Stack-chan CoreS3 firmware (ESP-IDF v5.5.4, esp32s3)"
            echo "Built from commit ${GITHUB_SHA:0:7} on ${GITHUB_REF_NAME}"
            echo
            echo "Flash with esptool (adjust the port):"
            echo "  python -m esptool --chip esp32s3 -p /dev/ttyACM0 -b 460800 \\"
            echo "    --before default_reset --after hard_reset write_flash \\"
            echo "    0x0 bootloader.bin 0x8000 partition-table.bin 0xd000 ota_data_initial.bin 0x10000 stackchan.bin"
            echo
            echo "Or with ESP-IDF: copy these files into <project>/build/ and run: idf.py flash"
          } > dist/FLASH_ME.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-firmware-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
